name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  # ============================================================
  # Build Configuration
  # ============================================================
  NODE_VERSION: "24"
  BUILD_COMMAND: "npm run build"
  DEPLOY_SOURCE: "./dist/"

  # Branch-based deployment:
  # main -> https://arunarudra.com/
  # dev  -> https://arunarudra.com/ArunArudra/
  VITE_BASE_PATH: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && '/' || '/ArunArudra/' }}
  DEPLOY_DESTINATION: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && './' || './ArunArudra/' }}
  WEBSITE_URL: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'https://arunarudra.com/' || 'https://arunarudra.com/ArunArudra/' }}

  # ============================================================
  # Supabase Configuration (GitHub Secrets)
  # Repository -> Settings -> Secrets and variables -> Actions
  # ============================================================
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  # ============================================================
  # Google AdSense Configuration
  # ============================================================
  VITE_SPONSOR_ENABLED: ${{ vars.VITE_SPONSOR_ENABLED }}
  VITE_ADSENSE_CLIENT: ${{ secrets.VITE_ADSENSE_CLIENT }}
  VITE_ADSENSE_SLOT: ${{ secrets.VITE_ADSENSE_SLOT }}

  # ============================================================
  # Site Content Limits (GitHub Variables)
  # ============================================================
  VITE_FEATURED_LIMIT: ${{ vars.VITE_FEATURED_LIMIT }}
  VITE_BLOG_LIMIT: ${{ vars.VITE_BLOG_LIMIT }}
  VITE_NEWS_PER_PAGE: ${{ vars.VITE_NEWS_PER_PAGE }}

  # ============================================================
  # Branding (GitHub Variables)
  # ============================================================
  VITE_BRAND_NAME: ${{ vars.VITE_BRAND_NAME }}
  VITE_COPYRIGHT: ${{ vars.VITE_COPYRIGHT }}

  # ============================================================
  # Contact Information (GitHub Variables)
  # ============================================================
  VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
  VITE_CONTACT_RECIPIENT: ${{ vars.VITE_CONTACT_RECIPIENT }}

  # ============================================================
  # Social Links (GitHub Variables)
  # Leave empty to hide unused icons
  # ============================================================
  VITE_SOCIAL_FACEBOOK: ${{ vars.VITE_SOCIAL_FACEBOOK }}
  VITE_SOCIAL_TWITTER: ${{ vars.VITE_SOCIAL_TWITTER }}
  VITE_SOCIAL_INSTAGRAM: ${{ vars.VITE_SOCIAL_INSTAGRAM }}
  VITE_SOCIAL_LINKEDIN: ${{ vars.VITE_SOCIAL_LINKEDIN }}
  VITE_SOCIAL_GITHUB: ${{ vars.VITE_SOCIAL_GITHUB }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Show branch deployment config
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Base path: ${{ env.VITE_BASE_PATH }}"
          echo "Deploy destination: ${{ env.DEPLOY_DESTINATION }}"
          echo "Website URL: ${{ env.WEBSITE_URL }}"

      - name: Build project
        run: ${{ env.BUILD_COMMAND }}

      - name: Run tests
        run: npm run test

      - name: Verify build artifacts
        run: |
          if [ -d "./dist" ]; then
            echo "Build artifacts exist"
            echo "Files to deploy:"
            ls -la ./dist | head -20
          else
            echo "Error: dist folder not found"
            exit 1
          fi

      # ============================================================
      # BLUEHOST DEPLOYMENT (via FTP)
      # Deploy only for push/manual runs, not pull requests.
      # ============================================================
      - name: Deploy to Bluehost
        if: github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ env.DEPLOY_SOURCE }}
          server-dir: ${{ env.DEPLOY_DESTINATION }}
          state-name: .ftp-deploy-sync-state-${{ github.ref_name }}.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            ArunArudra/**
          dry-run: false

      - name: Build completed successfully
        run: |
          echo "======================================"
          echo "Build and Deployment Complete"
          echo "======================================"
          echo "Website URL: ${{ env.WEBSITE_URL }}"
          echo "Base path: ${{ env.VITE_BASE_PATH }}"
          echo "Deployed to: ${{ env.DEPLOY_DESTINATION }}"
          echo "======================================"
