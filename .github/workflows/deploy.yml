name: Deploy to Production

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # ============================================================
  # Build Configuration
  # ============================================================
  NODE_VERSION: "24"
  BUILD_COMMAND: "npm run build"
  DEPLOY_SOURCE: "./dist/"
  DEPLOY_DESTINATION: "./"
  WEBSITE_URL: "https://arunarudra.com/"

  # ============================================================
  # Supabase Configuration (GitHub Secrets)
  # Add these under:
  # Repository → Settings → Secrets and variables → Actions → Secrets
  # ============================================================
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  # ============================================================
  # Google AdSense Configuration (GitHub Secrets)
  # ============================================================
  VITE_SPONSOR_ENABLED: ${{ vars.VITE_SPONSOR_ENABLED }}
  VITE_ADSENSE_CLIENT: ${{ secrets.VITE_ADSENSE_CLIENT }}
  VITE_ADSENSE_SLOT: ${{ secrets.VITE_ADSENSE_SLOT }}

  # ============================================================
  # Site Content Limits (GitHub Variables)
  # Repository → Settings → Secrets and variables → Actions → Variables
  # ============================================================
  VITE_FEATURED_LIMIT: ${{ vars.VITE_FEATURED_LIMIT }}
  VITE_BLOG_LIMIT: ${{ vars.VITE_BLOG_LIMIT }}
  VITE_NEWS_PER_PAGE: ${{ vars.VITE_NEWS_PER_PAGE }}

  # ============================================================
  # Branding (GitHub Variables)
  # ============================================================
  VITE_BRAND_NAME: ${{ vars.VITE_BRAND_NAME }}
  VITE_COPYRIGHT: ${{ vars.VITE_COPYRIGHT }}

  # ============================================================
  # Contact Information (GitHub Variables)
  # ============================================================
  # Email shown publicly on the Contact page (mailto: link)
  VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
  # Optional separate recipient for form submissions (defaults to VITE_CONTACT_EMAIL)
  VITE_CONTACT_RECIPIENT: ${{ vars.VITE_CONTACT_RECIPIENT }}

  # ============================================================
  # Social Links (GitHub Variables)
  # Leave empty to hide unused icons
  # ============================================================
  VITE_SOCIAL_FACEBOOK: ${{ vars.VITE_SOCIAL_FACEBOOK }}
  VITE_SOCIAL_TWITTER: ${{ vars.VITE_SOCIAL_TWITTER }}
  VITE_SOCIAL_INSTAGRAM: ${{ vars.VITE_SOCIAL_INSTAGRAM }}
  VITE_SOCIAL_LINKEDIN: ${{ vars.VITE_SOCIAL_LINKEDIN }}
  VITE_SOCIAL_GITHUB: ${{ vars.VITE_SOCIAL_GITHUB }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: ${{ env.BUILD_COMMAND }}

      - name: Run tests (optional)
        run: npm run test
        continue-on-error: true

      # ============================================================
      # BLUEHOST DEPLOYMENT (via FTP)
      # ============================================================
      - name: Deploy to Bluehost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ env.DEPLOY_SOURCE }}
          server-dir: ${{ env.DEPLOY_DESTINATION }}
          state-name: .ftp-deploy-sync-state.json
          dry-run: false

      # ============================================================
      # VERIFY FILES DEPLOYED SUCCESSFULLY
      # ============================================================
      - name: Verify files deployed successfully
        run: |
          if [ -d "./dist" ]; then
            echo "✅ Build artifacts exist"
            echo "Files to deploy:"
            ls -la ./dist | head -20
          else
            echo "❌ Error: dist folder not found"
            exit 1
          fi

      - name: Build completed successfully ✅
        run: |
          echo "======================================"
          echo "✅ Build and Deployment Complete!"
          echo "======================================"
          echo "🌐 Website URL: ${{ env.WEBSITE_URL }}"
          echo "📂 Deployed to: ${{ env.DEPLOY_DESTINATION }}"
          echo "======================================"
